<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Weather-Aware Truck Routing">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC21A"/>
      <stop offset="0.55" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF5A05"/>
    </linearGradient>
    <clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <!-- globe -->
  <circle cx="50" cy="50" r="48" fill="url(#g)"/>
  <g clip-path="url(#c)">
    <!-- main road: lower-left sweeping up and right -->
    <path d="M -10 78 C 25 60, 55 44, 112 34" fill="none" stroke="#0B0D10" stroke-width="17" stroke-linecap="butt"/>
    <path d="M -10 78 C 25 60, 55 44, 112 34" fill="none" stroke="#FF9A2E" stroke-width="2.6" stroke-dasharray="7 6" stroke-linecap="butt"/>
    <!-- second road: lower, parallel curve -->
    <path d="M 12 112 C 40 88, 70 70, 112 58" fill="none" stroke="#0B0D10" stroke-width="12"/>
    <path d="M 12 112 C 40 88, 70 70, 112 58" fill="none" stroke="#FF9A2E" stroke-width="2.2" stroke-dasharray="6 5"/>
    <!-- horizon lane at the top -->
    <path d="M 18 36 C 45 24, 75 20, 104 26" fill="none" stroke="#0B0D10" stroke-width="2.4"/>
  </g>
</svg>
