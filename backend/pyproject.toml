[project]
name = "weather-routing-backend"
version = "0.1.0"
description = "Weather-aware truck routing - Django REST Framework backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
testpaths = ["apps/routing/tests"]
python_files = ["test_*.py"]
# `-m "not live"` is the safety catch: live tests need a network (and, for
# TomTom, a key) and must never fire during an ordinary `pytest` run. Opt in
# explicitly with `pytest -m live`.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits a real provider over the network. Excluded by default; run with `pytest -m live`.",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = [
    "apps/routing/domain",
    "apps/routing/providers",
    "apps/routing/services",
    "apps/routing/api",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol method bodies are declarations, not executable code.
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
# Correctness and import hygiene; formatting is left to the editor.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # long lines: docstrings and URLs; the formatter is not enforced
  "B008",  # function calls in defaults (DRF serializer fields)
  "B904",  # raise ... from exc: enforced by review, many deliberate re-raises
  "B905",  # zip(strict=): positional alignment is asserted explicitly where it matters
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
